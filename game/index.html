<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gun Game Arena</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#11141a;font-family:'Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;color:#e8e4da}
  canvas{display:block}
  #dev{position:fixed;top:4px;left:4px;color:#0f0;font:12px monospace;display:none;z-index:40;white-space:pre}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(13,16,22,.88);z-index:30;text-align:center;padding:16px}
  .hidden{display:none!important}
  h1{font-size:clamp(28px,6vw,56px);letter-spacing:.12em;margin:0 0 6px;color:#e8e4da}
  h1 .accent{color:#ff7a1a}
  .sub{opacity:.75;margin:0 0 26px;font-size:clamp(12px,2.2vw,16px)}
  .maps{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
  .mapCard{width:min(180px,28vw);padding:14px 10px;border:2px solid #3a4150;border-radius:10px;cursor:pointer;
    background:#1a1f29;transition:border-color .15s,transform .15s}
  .mapCard:hover{transform:translateY(-2px)}
  .mapCard.sel{border-color:#ff7a1a;box-shadow:0 0 18px rgba(255,122,26,.25)}
  .mapCard .sw{height:56px;border-radius:6px;margin-bottom:10px;background-size:cover;background-position:center}
  .mapCard b{display:block;font-size:14px;letter-spacing:.08em}
  .mapCard span{font-size:11px;opacity:.65}
  .btn{background:#ff7a1a;color:#14100a;border:0;border-radius:8px;padding:14px 46px;font-size:18px;font-weight:700;
    letter-spacing:.1em;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;color:#e8e4da;border:2px solid #3a4150;margin-top:10px;font-size:14px;padding:10px 30px}
  .help{margin-top:22px;font-size:12px;opacity:.55;max-width:520px}
  #nameInp{background:#1a1f29;border:2px solid #3a4150;color:#e8e4da;border-radius:8px;padding:10px 14px;
    font-size:15px;text-align:center;letter-spacing:.08em;margin-bottom:16px;width:200px;outline:none}
  #nameInp:focus{border-color:#ffb03a}
  .menuRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  .menuRow .btn.ghost{margin-top:0}
  #mRandom{font-size:11px;opacity:.5;margin-top:10px}
  #mStatus{min-height:18px;color:#4ad7e8;font-size:13px;margin-top:8px}
  #roomBar{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
    background:#000000aa;border:1px solid #3a4150;border-radius:8px;padding:8px 12px;pointer-events:auto;font-size:12px}
  #roomBar input{width:min(210px,42vw);background:#1a1f29;border:1px solid #3a4150;color:#9aa4b2;border-radius:5px;
    padding:4px 8px;font-size:11px}
  #roomBar button{background:#ff7a1a;border:0;border-radius:5px;padding:5px 10px;font-weight:700;cursor:pointer;color:#14100a}
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:20}
  #xhair{--g:3px;position:absolute;left:50%;top:50%;width:0;height:0}
  #xhair div{position:absolute;left:0;top:0;background:#e8e4da;box-shadow:0 0 3px #000}
  #xhair .h1{width:7px;height:2px;transform:translate(calc(-100% - var(--g)),-1px)}
  #xhair .h2{width:7px;height:2px;transform:translate(var(--g),-1px)}
  #xhair .v1{width:2px;height:7px;transform:translate(-1px,calc(-100% - var(--g)))}
  #xhair .v2{width:2px;height:7px;transform:translate(-1px,var(--g))}
  #xhair.kill div{background:#ffb03a}
  #killBanner{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);font-size:15px;font-weight:700;
    letter-spacing:.18em;color:#ffb03a;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .35s;white-space:nowrap}
  #hitmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:26px;height:26px;
    opacity:0;transition:opacity .12s}
  #hitmark div{position:absolute;background:#ff7a1a}
  #hitmark .a{left:0;top:12px;width:8px;height:2px}#hitmark .b{right:0;top:12px;width:8px;height:2px}
  #hitmark .c{left:12px;top:0;width:2px;height:8px}#hitmark .d{left:12px;bottom:0;width:2px;height:8px}
  #vign{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(255,40,20,0);transition:box-shadow .2s}
  #botHud{position:absolute;left:18px;bottom:16px;text-shadow:0 1px 3px #000}
  #hpBar{width:190px;height:10px;background:#00000088;border:1px solid #3a4150;border-radius:4px;overflow:hidden;margin-top:6px}
  #hpFill{height:100%;width:100%;background:linear-gradient(90deg,#ff7a1a,#ffb03a);transition:width .15s}
  #ammo{position:absolute;right:18px;bottom:16px;text-align:right;text-shadow:0 1px 3px #000}
  #ammo .n{font-size:34px;font-weight:800;letter-spacing:.05em}
  #ammo .w{font-size:13px;letter-spacing:.14em;color:#ffb03a}
  #ammo .r{font-size:11px;color:#4ad7e8;height:14px}
  #ladder{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:7px}
  .lad{width:34px;height:7px;border-radius:3px;background:#3a4150cc}
  .lad.done{background:#ff7a1a}.lad.cur{background:#ffb03a;box-shadow:0 0 8px #ffb03a88}
  .lad .pip{display:none}
  #topline{position:absolute;top:12px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 1px 3px #000}
  #timer{font-size:24px;font-weight:700;letter-spacing:.08em}
  #lead{font-size:12px;opacity:.85;color:#4ad7e8}
  #feed{position:absolute;top:12px;right:14px;text-align:right;font-size:12px;text-shadow:0 1px 3px #000}
  #feed div{margin-bottom:3px;opacity:.95}
  #feed .me{color:#ffb03a}
  #centerMsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:22px;font-weight:700;
    letter-spacing:.1em;text-shadow:0 2px 6px #000;text-align:center}
  #centerMsg .small{font-size:13px;font-weight:400;opacity:.8}
  /* touch controls */
  #touchUI{position:fixed;inset:0;z-index:25;display:none;pointer-events:none}
  #stick{position:absolute;left:26px;bottom:70px;width:120px;height:120px;border:2px solid #ffffff33;border-radius:50%;
    pointer-events:auto}
  #knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:#ffffff3d}
  .tbtn{position:absolute;border-radius:50%;border:2px solid #ffffff44;background:#00000055;color:#e8e4da;
    display:flex;align-items:center;justify-content:center;font-weight:700;pointer-events:auto;letter-spacing:.06em}
  #fireBtn{right:30px;bottom:64px;width:92px;height:92px;font-size:15px;border-color:#ff7a1a88;color:#ffb03a}
  #jumpBtn{right:140px;bottom:38px;width:58px;height:58px;font-size:11px}
  #reloadBtn{right:44px;bottom:170px;width:52px;height:52px;font-size:15px;color:#4ad7e8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dev"></div>

<div id="hud" class="hidden">
  <div id="vign"></div>
  <div id="xhair"><div class="h1"></div><div class="h2"></div><div class="v1"></div><div class="v2"></div></div>
  <div id="hitmark"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div>
  <div id="topline"><div id="timer">6:00</div><div id="lead"></div></div>
  <div id="botHud"><div id="youName" style="font-size:12px;letter-spacing:.1em;opacity:.8"></div><div id="hpBar"><div id="hpFill"></div></div></div>
  <div id="ammo"><div class="w" id="wname"></div><div class="n" id="ammoN"></div><div class="r" id="ammoR"></div></div>
  <div id="ladder"></div>
  <div id="feed"></div>
  <div id="centerMsg"></div>
  <div id="killBanner"></div>
  <div id="roomBar" class="hidden"><span id="rbTxt"></span><input id="rbLink" readonly><button id="rbCopy"></button></div>
</div>

<div id="touchUI">
  <div id="stick"><div id="knob"></div></div>
  <div class="tbtn" id="fireBtn"></div>
  <div class="tbtn" id="zoomBtn"></div>
  <div class="tbtn" id="jumpBtn"></div>
  <div class="tbtn" id="reloadBtn"></div>
  <div class="tbtn" id="abilityBtn"></div>
  <div class="tbtn" id="useBtn"></div>
  <div class="tbtn" id="shopBtn"></div>
</div>
<div id="rotate"><div class="ic">📱</div><b></b><span></span></div>

<div id="menu" class="overlay">
  <h1 id="mTitle"></h1>
  <p class="sub" id="mSub"></p>
  <input id="nameInp" maxlength="14" spellcheck="false" autocomplete="off">
  <div class="menuRow">
    <button class="btn" id="onlineBtn"></button>
    <button class="btn ghost" id="startBtn"></button>
  </div>
  <div id="mRandom"></div>
  <div id="mStatus"></div>
  <p class="help" id="mHelp"></p>
</div>

<div id="pause" class="overlay hidden">
  <h1 id="pTitle"></h1>
  <button class="btn" id="resumeBtn"></button>
  <button class="btn ghost" id="pMenuBtn"></button>
</div>

<div id="end" class="overlay hidden">
  <h1 id="eTitle"></h1>
  <p class="sub" id="eDesc"></p>
  <button class="btn" id="againBtn"></button>
  <button class="btn ghost" id="eMenuBtn"></button>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
